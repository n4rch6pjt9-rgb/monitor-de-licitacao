version: '3.8'

services:
  # 1. Servidor Principal (Express + FrontEnd)
  web:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: monitor_web
    restart: always
    ports:
      - "3001:3001" # Mapeia a porta para o Nginx/Caddy interceptar depois
    env_file:
      - .env
    environment:
      - NODE_ENV=production
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  # 2. Worker Autônomo: PNCP (Roda via Cron ou loop infinito no script se configurado)
  worker-pncp:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: worker_pncp
    restart: on-failure
    env_file:
      - .env
    environment:
      - WORKER_CRON=true
    # Sobrescreve o CMD para rodar o worker invés do servidor
    command: ["npm", "run", "worker:pncp"]
    # Pode ser executado pontualmente se o container morrer ou usar um cron interno
    # Por hora, o container executará e desligará (se não houver loop no código)
    # Se o script não for daemon, é recomendado usar o crontab do Host para subir este container,
    # ou usar um scheduler (node-cron) dentro do worker.
    # Vou deixar como 'on-failure' pra ele não ficar loopando loucamente caso acabe rápido.
    restart: on-failure

  # 3. Worker Robusto: Puppeteer (SESC SP)
  worker-sescsp:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: worker_sescsp
    # O Puppeteer consome bastante RAM e pode estourar OOM (Out Of Memory).
    # O docker lidará com a reinicialização segura dele.
    restart: on-failure
    env_file:
      - .env
    environment:
      - WORKER_CRON=true
    command: ["npm", "run", "worker:sescsp"]
    # Configurações de SHM são vitais para o Puppeteer no Docker não dar erro de crash do Chrome
    shm_size: '1gb'
    # Limite de recursos (opcional mas recomendado para não derrubar a VPS)
    deploy:
      resources:
        limits:
          memory: 1G
