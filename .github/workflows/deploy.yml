name: Deploy to Hetzner

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v3

      - name: Deploy to VPS via SSH
        uses: appleboy/ssh-action@master
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          script: |
            # Acessar a pasta do projeto (ajuste o caminho se necessário)
            cd /opt/monitor-de-licitacao || exit
            
            # Garantir que a main está atualizada
            git fetch origin
            git reset --hard origin/main
            
            # Refazer o build e reiniciar os containers em background com downtime mínimo
            docker compose -f docker-compose.production.yml up -d --build
            
            # Limpar imagens antigas (prune) para não lotar o disco da Hetzner
            docker image prune -f
